<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>桌面歌词</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #container {
      -webkit-app-region: drag;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8px 16px;
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      user-select: none;
    }
    #bg {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: transparent;
      pointer-events: none;
    }
    #toolbar {
      -webkit-app-region: drag;
      pointer-events: auto;
      position: absolute;
      top: 6px;
      right: 10px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #container:hover #toolbar { opacity: 1; }
    .tool-btn {
      -webkit-app-region: no-drag;
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      line-height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .tool-btn:hover { background: rgba(255, 255, 255, 0.32); }
    #lyrics {
      position: relative;
      width: 100%;
      text-align: center;
    }
    #current {
      font-weight: 600;
      line-height: 1.3;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.2s;
      /* 白色描边（与主界面歌词样式一致） */
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55), 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
    }
    #current.paused { opacity: 0.7; font-style: italic; }
    #next {
      margin-top: 6px;
      opacity: 0.55;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5), 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
    }
    #next.paused { opacity: 0.45; font-style: italic; }
    #placeholder {
      position: relative;
      color: rgba(255, 255, 255, 0.6);
      font-size: 20px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5), 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="bg"></div>
    <div id="toolbar">
      <button class="tool-btn" id="btn-close" title="关闭桌面歌词">×</button>
    </div>
    <div id="lyrics">
      <div id="placeholder">KMusic 桌面歌词</div>
      <div id="current" style="display:none;"></div>
      <div id="next" style="display:none;"></div>
    </div>
  </div>
  <script>
    (function () {
      var state = {
        fontSize: 36,
        color: '#ffffff',
        bgColor: '#000000',
        bgOpacity: 0.25,
        showNext: true,
        align: 'center'
      };

      var current = document.getElementById('current');
      var next = document.getElementById('next');
      var placeholder = document.getElementById('placeholder');
      var bg = document.getElementById('bg');
      var container = document.getElementById('container');
      var toolbar = document.getElementById('toolbar');

      function hexToRgba(hex, a) {
        hex = (hex || '#000000').replace('#', '');
        if (hex.length === 3) hex = hex.split('').map(function (c) { return c + c; }).join('');
        var r = parseInt(hex.substr(0, 2), 16) || 0;
        var g = parseInt(hex.substr(2, 2), 16) || 0;
        var b = parseInt(hex.substr(4, 2), 16) || 0;
        return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
      }

      function applyStyle(s) {
        if (!s) return;
        Object.assign(state, s);
        current.style.fontSize = state.fontSize + 'px';
        current.style.color = state.color;
        next.style.fontSize = Math.round(state.fontSize * 0.62) + 'px';
        next.style.color = state.color;
        next.style.display = state.showNext ? 'block' : 'none';
        bg.style.background = state.bgOpacity > 0 ? hexToRgba(state.bgColor, state.bgOpacity) : 'transparent';
        document.getElementById('lyrics').style.textAlign = state.align === 'left' ? 'left' : 'center';
        // 鼠标穿透：开启时容器不接收鼠标事件（工具栏仍可用）
        container.style.pointerEvents = state.clickThrough ? 'none' : 'auto';
      }

      function showPlaceholder(text) {
        placeholder.textContent = text || 'KMusic 桌面歌词';
        placeholder.style.display = 'block';
        current.style.display = 'none';
        next.style.display = 'none';
      }

      function update(d) {
        if (!d || d.noSong) {
          showPlaceholder('KMusic 桌面歌词');
          return;
        }
        if (!d.hasLyrics) {
          placeholder.style.display = 'none';
          current.style.display = 'block';
          current.classList.add('paused');
          current.textContent = (d.title ? d.title + ' - ' : '') + (d.artist || '');
          next.style.display = 'none';
          return;
        }
        if (!d.current) {
          // 有歌词但还没到当前句：渲染到 #current 以套用用户配置的样式，而非占位元素
          placeholder.style.display = 'none';
          current.style.display = 'block';
          current.classList.add('paused');
          current.textContent = '♪ ' + (d.title || '') + (d.artist ? (' - ' + d.artist) : '');
          next.style.display = 'none';
          return;
        }
        placeholder.style.display = 'none';
        current.style.display = 'block';
        current.classList.toggle('paused', !d.isPlaying);
        current.textContent = d.current;
        if (state.showNext) {
          next.style.display = 'block';
          next.classList.toggle('paused', !d.isPlaying);
          next.textContent = d.next || '';
        } else {
          next.style.display = 'none';
        }
      }

      var api = window.electronAPI;
      if (api && api.lyrics) {
        api.lyrics.onUpdate(update);
        api.lyrics.onStyle(applyStyle);
        document.getElementById('btn-close').onclick = function () {
          api.lyrics.setEnabled(false);
        };
      } else {
        showPlaceholder('仅桌面端支持');
      }
    })();
  </script>
</body>
</html>
