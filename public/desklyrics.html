<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>桌面歌词</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #container {
      -webkit-app-region: drag;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8px 16px;
      position: relative;
      user-select: none;
    }
    #bg {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: transparent;
      pointer-events: none;
    }
    /* Canvas 居中 */
    #canvas-wrap {
      position: relative;
      width: 100%;
    }
    #lyricCanvas {
      display: block;
      width: 100%;
    }
    #toolbar {
      -webkit-app-region: drag;
      pointer-events: auto;
      position: absolute;
      top: 6px;
      right: 10px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #container:hover #toolbar { opacity: 1; }
    .tool-btn {
      -webkit-app-region: no-drag;
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      line-height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .tool-btn:hover { background: rgba(255, 255, 255, 0.32); }
  </style>
</head>
<body>
  <div id="container">
    <div id="bg"></div>
    <div id="toolbar">
      <button class="tool-btn" id="btn-close" title="关闭桌面歌词">×</button>
    </div>
    <div id="canvas-wrap">
      <canvas id="lyricCanvas"></canvas>
    </div>
  </div>
  <script>
    (function () {
      var state = {
        fontSize: 36,
        color: '#ffffff',
        bgColor: '#000000',
        bgOpacity: 0.25,
        showNext: true,
        align: 'center'
      };

      var canvas = document.getElementById('lyricCanvas');
      var ctx = canvas.getContext('2d');
      var bg = document.getElementById('bg');
      var container = document.getElementById('container');

      // 当前显示数据
      var currentData = null;

      // 设备像素比，保证 HiDPI 清晰度
      var dpr = window.devicePixelRatio || 1;

      function hexToRgba(hex, a) {
        hex = (hex || '#000000').replace('#', '');
        if (hex.length === 3) hex = hex.split('').map(function (c) { return c + c; }).join('');
        var r = parseInt(hex.substr(0, 2), 16) || 0;
        var g = parseInt(hex.substr(2, 2), 16) || 0;
        var b = parseInt(hex.substr(4, 2), 16) || 0;
        return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
      }

      // 将 CSS 颜色字符串转为带指定 alpha 的 rgba（兼容 hex/#rrggbb/rgb/rgba 等格式）
      function colorWithAlpha(cssColor, alpha) {
        if (!cssColor) return 'rgba(255,255,255,' + alpha + ')';
        var c = cssColor.trim();
        // 已是 rgba
        if (c.indexOf('rgba') === 0) {
          return c.replace(/[\d.]+\s*\)$/, alpha + ')');
        }
        // 已是 rgb → 转 rgba
        if (c.indexOf('rgb(') === 0) {
          return c.replace('rgb(', 'rgba(').replace(')', ',' + alpha + ')');
        }
        // hex 格式
        var hex = c.replace('#', '');
        if (hex.length === 3) hex = hex.split('').map(function (x) { return x + x; }).join('');
        if (hex.length !== 6) return 'rgba(255,255,255,' + alpha + ')';
        var r = parseInt(hex.substr(0, 2), 16);
        var g = parseInt(hex.substr(2, 2), 16);
        var b = parseInt(hex.substr(4, 2), 16);
        if (isNaN(r) || isNaN(g) || isNaN(b)) return 'rgba(255,255,255,' + alpha + ')';
        return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
      }

      function applyStyle(s) {
        if (!s) return;
        Object.assign(state, s);
        bg.style.background = state.bgOpacity > 0 ? hexToRgba(state.bgColor, state.bgOpacity) : 'transparent';
        container.style.pointerEvents = state.clickThrough ? 'none' : 'auto';
        render();
      }

      function resizeCanvas() {
        var wrap = canvas.parentElement;
        var w = wrap.clientWidth || 900;
        // 预估高度：主行 + 可选次行
        var fs = state.fontSize || 36;
        var h = Math.ceil(fs * 1.3) + (state.showNext ? Math.ceil(fs * 0.62 * 1.2) + 6 : 0) + 16;

        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        render();
      }

      // 核心：Canvas 高质量文字绘制
      function render() {
        var fs = state.fontSize || 36;
        var w = canvas.width / dpr;
        var h = canvas.height / dpr;

        ctx.clearRect(0, 0, w, h);

        if (!currentData) {
          drawText('KMusic 桌面歌词', fs * 0.55, 'center', 'rgba(255,255,255,0.6)', true);
          return;
        }

        if (currentData.noSong) {
          drawText('KMusic 桌面歌词', fs * 0.55, 'center', 'rgba(255,255,255,0.6)', true);
          return;
        }

        if (!currentData.hasLyrics) {
          var txt = (currentData.title ? currentData.title + ' - ' : '') + (currentData.artist || '');
          drawText(txt || '♪', fs, state.align, state.color || '#ffffff', !currentData.isPlaying);
          return;
        }

        if (!currentData.current) {
          var txt2 = '♪ ' + (currentData.title || '') + (currentData.artist ? (' - ' + currentData.artist) : '');
          drawText(txt2 || '♪', fs, state.align, state.color || '#ffffff', true);
          return;
        }

        // 主行歌词
        var mainY = fs;
        drawText(currentData.current, fs, state.align, state.color || '#ffffff', !currentData.isPlaying, mainY);

        // 下一行歌词
        if (state.showNext && currentData.next) {
          var nextFs = Math.round(fs * 0.62);
          // next 行用 colorWithAlpha 降低不透明度
          var nextColorStr = colorWithAlpha(state.color || '#ffffff', 0.55);
          drawText(currentData.next, nextFs, state.align, nextColorStr, !currentData.isPlaying, mainY + nextFs * 1.2 + 6);
        }
      }

      /**
       * 绘制单行高质量歌词文字
       * @param {string} text - 文字内容
       * @param {number} fontSize - 字号
       * @param {string} align - left/center
       * @param {string} color - CSS 颜色字符串（#rrggbb / rgb() / rgba() 等）
       * @param {boolean} paused - 是否暂停（斜体+半透明）
       * @param {number} baselineY - 基线 Y 坐标（默认居中）
       */
      function drawText(text, fontSize, align, color, paused, baselineY) {
        if (!text) return;

        var w = canvas.width / dpr;
        var h = canvas.height / dpr;
        var y = baselineY || (h / 2 + fontSize * 0.35);

        // 字体设置
        ctx.font = (paused ? 'italic ' : '') + '700 ' + fontSize + 'px "MapleMono-CN", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", monospace, sans-serif';
        ctx.textAlign = align === 'left' ? 'left' : 'center';
        ctx.textBaseline = 'alphabetic';

        // X 坐标
        var x = align === 'left' ? 16 : w / 2;

        // 描边宽度随字号缩放（核心：比 DOM text-shadow 更粗更清晰）
        var strokeW = Math.max(1.5, fontSize / 20);

        // 暂停时整体降低不透明度
        if (paused) {
          ctx.globalAlpha = 0.7;
        }

        // ====== 第一层：白色描边（stroke）======
        ctx.strokeStyle = 'rgba(255,255,255,1)';
        ctx.lineWidth = strokeW;
        ctx.lineJoin = 'round';
        ctx.miterLimit = 2;
        ctx.strokeText(text, x, y);

        // ====== 第二层：文字填充 ======
        ctx.fillStyle = color || '#ffffff';
        ctx.fillText(text, x, y);

        // 恢复 globalAlpha
        ctx.globalAlpha = 1;
      }

      function update(d) {
        currentData = d;
        render();
      }

      // 监听窗口尺寸变化
      window.addEventListener('resize', resizeCanvas);

      var api = window.electronAPI;
      if (api && api.lyrics) {
        api.lyrics.onUpdate(update);
        api.lyrics.onStyle(applyStyle);
        document.getElementById('btn-close').onclick = function () {
          api.lyrics.setEnabled(false);
        };
        // 初始化尺寸
        setTimeout(resizeCanvas, 50);
      } else {
        currentData = { noSong: true };
        setTimeout(resizeCanvas, 50);
      }
    })();
  </script>
</body>
</html>
